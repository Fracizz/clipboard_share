[package]
name = "clipboard_share"
version = "0.1.0"
edition = "2024"
description = "LAN clipboard sync for Windows (text, images, files)"
license = "MIT"
repository = "https://github.com/Fracizz/clipboard_share"
readme = "README.md"
keywords = ["clipboard", "windows", "lan", "sync"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.5", features = ["derive"] }
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spake2 = "0.4.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Graphics_Imaging", "Security_Cryptography", "Security_Cryptography_DataProtection", "Storage", "Storage_Search", "Storage_Streams", "System", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.3.2"
winreg = "0.56.0"
